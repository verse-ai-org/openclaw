name: Electron Release

# 推送 vX.Y.Z 格式 tag 时触发（与 npm release 共用同一 tag）
on:
  push:
    tags:
      - "v*"

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "10.23.0"

jobs:
  # ─── macOS 打包 ────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"
          use-sticky-disk: "false"

      # 导入 macOS 签名证书（Developer ID Application）
      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Build & Package (macOS ${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          # App Store Connect 公证凭据
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          # electron-builder 读取 publish 配置时不实际上传（CI 手动上传）
          # 设置为 never 避免 electron-builder 自行尝试上传
          ELECTRON_BUILDER_PUBLISH: never
        run: |
          bash apps/electron/scripts/package-electron.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          # 上传 DMG、ZIP 和描述文件
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/*.yml
            apps/electron/release/*.blockmap
          retention-days: 3

  # ─── 上传到 Cloudflare R2 ──────────────────────────────────────────────────
  upload-r2:
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat >> ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          acl = private
          EOF

      - name: Upload release files to R2
        env:
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          DEST="r2:${R2_BUCKET_NAME}/bossim/releases"

          # 上传安装包（DMG / ZIP / blockmap）
          # --no-update-modtime 避免触发不必要的重传
          rclone copy artifacts/ "$DEST" \
            --include "*.dmg" \
            --include "*.zip" \
            --include "*.blockmap" \
            --s3-no-check-bucket \
            --no-update-modtime \
            -v

          # 最后上传描述文件（latest-mac.yml）
          # 必须在安装包上传完成后再上传，否则客户端可能下载到尚未就绪的包
          rclone copy artifacts/ "$DEST" \
            --include "*.yml" \
            --s3-no-check-bucket \
            --no-update-modtime \
            -v

          echo "✅ 上传完成，更新地址: https://files.aiverser.com/bossim/releases/"

      - name: Verify upload (latest-mac.yml accessible)
        run: |
          sleep 5  # 等待 Cloudflare 边缘节点缓存刷新
          curl -fsSL "https://files.aiverser.com/bossim/releases/latest-mac.yml" | head -5
          echo "✅ latest-mac.yml 可公开访问"
