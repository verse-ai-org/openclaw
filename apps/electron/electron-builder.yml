appId: com.verse.bossim
productName: Bossim
copyright: "Bossim Contributors"

# 构建输出目录
directories:
  output: release/
  buildResources: resources/

# asar 打包主进程代码
asar: true

# 不进 asar 的资源（需要保持文件权限的可执行文件）
asarUnpack:
  - "**/*.node"

# 将外部资源打包进 Resources/
extraResources:
  # Electron 42+ 内嵌 Node 24.15.0，不再需要独立的 Node 二进制（省 ~114 MB）。
  # Gateway 子进程通过 Electron 自身的 Node 运行时启动（见 src/main/gateway/）。

  # openclaw CLI 入口脚本
  - from: "../../openclaw.mjs"
    to: "openclaw/openclaw.mjs"

  # 根 package.json（含 "type": "module"），Node 用它识别 dist/*.js 为 ESM
  - from: "../../package.json"
    to: "openclaw/package.json"

  # openclaw 编译产物（dist/）
  - from: "../../dist"
    to: "openclaw/dist"
    filter:
      - "**/*"
      - "!**/*.map"        # 生产环境不需要 sourcemap
      - "!**/test*"
      - "!**/*.d.ts"       # 类型声明仅供外部插件开发，运行时不需要
      # Electron 使用 ui-react（Resources/control-ui-react）；旧 Lit control-ui 仅 CLI 需要，不必打进 app
      - "!control-ui/**"
      - "!control-ui-react/**"  # 已单独复制到 Resources/control-ui-react/，避免重复
      - "!plugin-sdk/src/**"    # plugin-sdk 类型源文件（纯 .d.ts），运行时不需要
      - "!plugin-sdk/packages/**"
      - "!plugin-sdk/.tsbuildinfo"

  # 运行时原生依赖（tsdown bundle 已内联大部分 JS 依赖，此处仅含含 .node 绑定的原生模块）
  # 由 package-electron.sh 中的 pnpm deploy --prod + 精简过滤展开到 resources/prod-node_modules/
  # 原生模块列表见 tsdown.config.electron.ts 的 NATIVE_EXTERNALS
  - from: "resources/prod-node_modules/node_modules"
    to: "openclaw/node_modules"
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/__mocks__/**"
      - "!**/docs/**"
      # - "!**/doc/**"
      - "!**/documentation/**"
      - "!**/example/**"
      - "!**/examples/**"
      - "!**/*.md"
      - "!**/LICENSE*"
      - "!**/README*"
      - "!**/CHANGELOG*"
      - "!**/HISTORY*"
      - "!**/CHANGES*"
      - "!**/.github/**"
      - "!**/.gitlab/**"
      - "!**/.circleci/**"
      - "!**/.vscode/**"
      - "!**/.idea/**"
      # - "!**/bin/**"
      # - "!**/scripts/**"
      - "!**/*.sh"
      - "!**/*.bat"
      - "!**/*.ps1"
      # - "!**/*.yml"
      # - "!**/*.yaml"
      # - "!**/*.jsonc"
      # - "!**/*.config.js"
      # - "!**/*.config.ts"
      - "!**/tsconfig*.json"
      - "!**/jest*.json"
      - "!**/vitest*.json"
      # pdf-parse 内置多份 pdf.js 版本作为 fallback，只保留最新版（v2.0.550）
      - "!**/pdf-parse/lib/pdf.js/v1*/**"

  # 内置 Skills（Built-in Skills 页面数据来源）
  - from: "../../skills"
    to: "openclaw/skills"
    filter: ["**/*"]

  # workspace 模板文件（AGENTS.md, SOUL.md, TOOLS.md 等）
  - from: "../../docs/reference/templates"
    to: "openclaw/docs/reference/templates"
    filter: ["**/*"]

  # Bundled plugin runtime overlays（由 pnpm build → runtime-postbuild 生成）。
  # 包含所有 bundled extensions 的编译产物 + overlay wrappers，替代逐个复制源码目录。
  # 新增 extension 无需修改此文件，只要 tsdown.config.ts 中注册即可自动打包。
  - from: "../../dist-runtime"
    to: "openclaw/dist-runtime"
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"

  # Extensions excluded from core tsdown build (bundledDist: false or
  # EXCLUDED_CORE_BUNDLED_PLUGIN_DIRS) but still needed at runtime — shipped
  # as source, loaded via jiti.
  - from: "../../extensions/slack"
    to: "openclaw/extensions/slack"
    filter: ["**/*", "!node_modules/**", "!**/*.map", "!**/*.test.*", "!tsconfig.json"]
  - from: "../../extensions/whatsapp"
    to: "openclaw/extensions/whatsapp"
    filter: ["**/*", "!node_modules/**", "!**/*.map", "!**/*.test.*", "!tsconfig.json"]

  # ui-react Setup Wizard 构建产物
  - from: "../../dist/control-ui-react"
    to: "control-ui-react"


# 自动更新：产物描述文件（latest-mac.yml / latest.yml）上传到 Cloudflare R2
# CI 通过 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINT_URL_S3 / S3_BUCKET 上传
# 运行时 app 从 https://files.aiverser.com/bossim/releases/ 拉取更新
publish:
  provider: generic
  url: https://files.aiverser.com/bossim/releases/
  channel: latest
# 为所有通道生成更新文件（beta/alpha/latest），让 electron-updater 能正确识别版本
generateUpdatesFilesForAllChannels: true

# Runtime node_modules live in extraResources; skip pnpm workspace tree walk (EMFILE on large monorepos).
beforeBuild: scripts/before-build.cjs

# afterPack: node shim for packaged skills eligibility + Windows exe icon patch
afterPack: scripts/after-pack.cjs
# 公证 hook（签名完成后自动执行，需设置 APP_STORE_CONNECT_* 环境变量）
afterSign: scripts/notarize.cjs

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  gatekeeperAssess: false
  identity: "CBFA4655YD"
  # 公证要求：所有二进制必须含安全时间戳（包括 Squirrel.framework/ShipIt）
  timestamp: "http://timestamp.apple.com/ts01"
  # URL Scheme for OAuth callbacks (openclaw://oauth/callback?...)
  protocols:
    - name: OpenClaw OAuth
      schemes:
        - openclaw
  # 架构由打包脚本通过 --arch 参数指定（arm64 或 x64），每次只打单架构
  target:
    - target: dmg
    - target: zip

dmg:
  title: "Bossim ${version}"
  size: "4000m"
  background: null
  backgroundColor: "#ffffff"
  icon: null
  badgeIcon: null
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  # Do not use signAndEditExecutable: true without a working winCodeSign cache — it downloads
  # winCodeSign from GitHub and may fail on Windows (symlink privilege / network). Icon/metadata
  # are applied in afterPack via scripts/after-pack.cjs (rcedit npm).
  signAndEditExecutable: false
  # URL Scheme for OAuth callbacks (openclaw://oauth/callback?...)
  protocols:
    - name: OpenClaw OAuth
      schemes:
        - openclaw
  # Electron 42+ 内嵌 Node 24，Windows 不再需要独立 node.exe
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bossim
  # 差量包在 Windows 上易触发 NSIS「删旧未装新」；与 autoUpdater.disableDifferentialDownload 配合
  differentialPackage: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
