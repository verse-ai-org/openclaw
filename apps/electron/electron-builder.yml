appId: com.verse.bossim
productName: Bossim
copyright: "Bossim Contributors"

# 构建输出目录
directories:
  output: release/
  buildResources: resources/

# asar 打包主进程代码
asar: true

# 不进 asar 的资源（需要保持文件权限的可执行文件）
asarUnpack:
  - "**/*.node"

# 将外部资源打包进 Resources/
extraResources:
  # 捆绑的 Node 24 二进制（由 download-node.sh 下载到 resources/node-${arch}/）
  # macOS / Linux：可执行文件名为 node
  - from: "resources/node-${arch}/node"
    to: "node/node"
    filter: ["!*.exe"]

  # openclaw CLI 入口脚本
  - from: "../../openclaw.mjs"
    to: "openclaw/openclaw.mjs"

  # 根 package.json（含 "type": "module"），Node 用它识别 dist/*.js 为 ESM
  - from: "../../package.json"
    to: "openclaw/package.json"

  # openclaw 编译产物（dist/）
  - from: "../../dist"
    to: "openclaw/dist"
    filter:
      - "**/*"
      - "!**/*.map"        # 生产环境不需要 sourcemap
      - "!**/test*"
      # Electron 使用 ui-react（Resources/control-ui-react）；旧 Lit control-ui 仅 CLI 需要，不必打进 app
      - "!control-ui/**"

  # 运行时原生依赖（tsdown bundle 已内联大部分 JS 依赖，此处仅含含 .node 绑定的原生模块）
  # 由 package-electron.sh 中的 pnpm deploy --prod + 精简过滤展开到 resources/prod-node_modules/
  # 原生模块列表见 tsdown.config.electron.ts 的 NATIVE_EXTERNALS
  - from: "resources/prod-node_modules/node_modules"
    to: "openclaw/node_modules"
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/__mocks__/**"
      - "!**/docs/**"
      # - "!**/doc/**"
      - "!**/documentation/**"
      - "!**/example/**"
      - "!**/examples/**"
      - "!**/*.md"
      - "!**/LICENSE*"
      - "!**/README*"
      - "!**/CHANGELOG*"
      - "!**/HISTORY*"
      - "!**/CHANGES*"
      - "!**/.github/**"
      - "!**/.gitlab/**"
      - "!**/.circleci/**"
      - "!**/.vscode/**"
      - "!**/.idea/**"
      # - "!**/bin/**"
      # - "!**/scripts/**"
      - "!**/*.sh"
      - "!**/*.bat"
      - "!**/*.ps1"
      # - "!**/*.yml"
      # - "!**/*.yaml"
      # - "!**/*.jsonc"
      # - "!**/*.config.js"
      # - "!**/*.config.ts"
      - "!**/tsconfig*.json"
      - "!**/jest*.json"
      - "!**/vitest*.json"
      # pdf-parse 内置多份 pdf.js 版本作为 fallback，只保留最新版（v2.0.550）
      - "!**/pdf-parse/lib/pdf.js/v1*/**"

  # 内置 Skills（Built-in Skills 页面数据来源）
  - from: "../../skills"
    to: "openclaw/skills"
    filter: ["**/*"]

  # workspace 模板文件（AGENTS.md, SOUL.md, TOOLS.md 等）
  - from: "../../docs/reference/templates"
    to: "openclaw/docs/reference/templates"
    filter: ["**/*"]

  # 全量扩展（所有 extensions/* 均打包进安装包，后续按需裁剪包体积）

  # 基础设施
  - from: "../../extensions/memory-core"
    to: "openclaw/extensions/memory-core"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]
