# 自动更新：产物描述文件（latest-mac.yml / latest.yml）上传到 Cloudflare R2
# CI 通过 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_ENDPOINT_URL_S3 / S3_BUCKET 上传
# 运行时 app 从 https://files.aiverser.com/bossim/releases/ 拉取更新
publish:
  provider: generic
  url: https://files.aiverser.com/bossim/releases/
  channel: latest
# 为所有通道生成更新文件（beta/alpha/latest），让 electron-updater 能正确识别版本
generateUpdatesFilesForAllChannels: true

# 公证 hook（签名完成后自动执行，需设置 APP_STORE_CONNECT_* 环境变量）
afterSign: scripts/notarize.cjs

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  gatekeeperAssess: false
  identity: "CBFA4655YD"
  # URL Scheme for OAuth callbacks (openclaw://oauth/callback?...)
  protocols:
    - name: OpenClaw OAuth
      schemes:
        - openclaw
  # 架构由打包脚本通过 --arch 参数指定（arm64 或 x64），每次只打单架构
  target:
    - target: dmg
    - target: zip

dmg:
  title: "Bossim ${version}"
  size: "4000m"
  background: null
  backgroundColor: "#ffffff"
  icon: null
  badgeIcon: null
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  signAndEditExecutable: false
  # URL Scheme for OAuth callbacks (openclaw://oauth/callback?...)
  protocols:
    - name: OpenClaw OAuth
      schemes:
        - openclaw
  extraResources:
    # Windows：可执行文件名为 node.exe
    - from: "resources/node-${arch}/node.exe"
      to: "node/node.exe"
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bossim

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
