appId: com.verse.bossim
productName: Bossim 
copyright: "Bossim Contributors"

# 构建输出目录
directories:
  output: release/
  buildResources: resources/

# asar 打包主进程代码
asar: true

# 不进 asar 的资源（需要保持文件权限的可执行文件）
asarUnpack:
  - "**/*.node"

# 将外部资源打包进 Resources/
extraResources:
  # 捆绑的 Node 22 二进制（由 download-node.sh 下载到 resources/node-${arch}/）
  # macOS / Linux：可执行文件名为 node
  - from: "resources/node-${arch}/node"
    to: "node/node"
    filter: ["!*.exe"]

  # openclaw CLI 入口脚本
  - from: "../../openclaw.mjs"
    to: "openclaw/openclaw.mjs"

  # 根 package.json（含 "type": "module"），Node 用它识别 dist/*.js 为 ESM
  - from: "../../package.json"
    to: "openclaw/package.json"

  # openclaw 编译产物（dist/）
  - from: "../../dist"
    to: "openclaw/dist"
    filter:
      - "**/*"
      - "!**/*.map"        # 生产环境不需要 sourcemap
      - "!**/test*"

  # 运行时原生依赖（tsdown bundle 已内联大部分 JS 依赖，此处仅含含 .node 绑定的原生模块）
  # 由 package-electron.sh 中的 pnpm deploy --prod + 精简过滤展开到 resources/prod-node_modules/
  # 原生模块列表见 tsdown.config.electron.ts 的 NATIVE_EXTERNALS
  - from: "resources/prod-node_modules/node_modules"
    to: "openclaw/node_modules"
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/docs/**"
      - "!**/example/**"
      - "!**/examples/**"

  # workspace 模板文件（AGENTS.md, SOUL.md, TOOLS.md 等）
  - from: "../../docs/reference/templates"
    to: "openclaw/docs/reference/templates"
    filter: ["**/*"]

  # 核心扩展（随安装包预装，保证开箱即用的基本功能）
  # 可选扩展由用户通过扩展管理界面按需安装到 ~/.openclaw/extensions/

  # 基础设施
  - from: "../../extensions/memory-core"
    to: "openclaw/extensions/memory-core"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]
  - from: "../../extensions/device-pair"
    to: "openclaw/extensions/device-pair"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]

  # AI Provider 认证
  - from: "../../extensions/qwen-portal-auth"
    to: "openclaw/extensions/qwen-portal-auth"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]
  - from: "../../extensions/minimax-portal-auth"
    to: "openclaw/extensions/minimax-portal-auth"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]
  - from: "../../extensions/google-gemini-cli-auth"
    to: "openclaw/extensions/google-gemini-cli-auth"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]
  - from: "../../extensions/copilot-proxy"
    to: "openclaw/extensions/copilot-proxy"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]

  # 消息通道
  - from: "../../extensions/telegram"
    to: "openclaw/extensions/telegram"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]
  - from: "../../extensions/discord"
    to: "openclaw/extensions/discord"
    filter: ["**/*", "!node_modules/**", "!**/*.map"]

  # Control UI 构建产物
  - from: "../../dist/control-ui"
    to: "control-ui"

  # ui-react Setup Wizard 构建产物
  - from: "../../dist/control-ui-react"
    to: "control-ui-react"


# 公证 hook（签名完成后自动执行，需设置 APP_STORE_CONNECT_* 环境变量）
afterSign: scripts/notarize.cjs

mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  gatekeeperAssess: false
  identity: "CBFA4655YD"
  # URL Scheme for OAuth callbacks (openclaw://oauth/callback?...)
  protocols:
    - name: OpenClaw OAuth
      schemes:
        - openclaw
  # 支持 arm64（Apple Silicon）和 x64（Intel）
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: "Bossim ${version}"
  background: "../../assets/dmg-background.png"
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications
  internetEnabled: false

win:
  icon: resources/icon.ico
  # URL Scheme for OAuth callbacks (openclaw://oauth/callback?...)
  protocols:
    - name: OpenClaw OAuth
      schemes:
        - openclaw
  extraResources:
    # Windows：可执行文件名为 node.exe
    - from: "resources/node-${arch}/node.exe"
      to: "node/node.exe"
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bossim
